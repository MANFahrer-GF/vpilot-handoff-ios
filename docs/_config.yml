# GitHub Pages serves this folder. A theme only so the pages are readable; there is
# no site to speak of beyond the four documents.
title: vPilot Remote
description: iPad client for the Handoff vPilot plugin
theme: jekyll-theme-minimal

# source.json is the retired sideload feed: it now only tells SideStore/AltStore
# users where the app went. Jekyll must copy it through rather than treat it as a
# page, so the URL people added keeps resolving.
include:
  - source.json
