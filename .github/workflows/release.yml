name: Release

# Opens a draft GitHub release for a pushed v* tag, with RELEASE-NOTES.md as the
# body. No binary is attached: the App Store is the download, TestFlight the beta.
# The draft is published by hand once the store version is live.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the notes match the tag
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          head -1 RELEASE-NOTES.md | grep -q "$version" || {
            echo "RELEASE-NOTES.md does not start with a heading for $version"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: vPilot Remote ${{ github.ref_name }}
          body_path: RELEASE-NOTES.md
