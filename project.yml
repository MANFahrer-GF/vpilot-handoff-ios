name: Handoff
options:
  bundleIdPrefix: com.thomaskant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English is the source language. Only the settings surface carries German
  # translations -- the cockpit stays English everywhere, like the radio work it
  # mirrors and like the Android original.
  developmentLanguage: en

fileGroups:
  - Handoff/Localizable.xcstrings

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your own Apple Development Team ID here (Xcode > Settings > Accounts),
    # or leave blank and pick the team in Xcode's Signing & Capabilities tab.
    # Kept out of version control so a fork doesn't inherit someone else's account.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  Handoff:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Handoff
    info:
      path: Handoff/Info.plist
      properties:
        CFBundleDisplayName: Handoff
        # xcodegen writes this file, so the version has to be threaded through
        # here -- editing Info.plist directly is undone by the next generate.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Handoff connects over your local network to the vPilot plugin on your PC to mirror the controller list, chat and radio panel."
        NSBonjourServices: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomaskant.handoff
        # Both feed Info.plist. The release workflow overrides MARKETING_VERSION
        # with the git tag, so a tagged build carries its own version number.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: false

  HandoffTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HandoffTests
    dependencies:
      - target: Handoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomaskant.handoff.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Handoff:
    build:
      targets:
        Handoff: all
        HandoffTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HandoffTests
